[workspace]
members = ["macros"]

[workspace.dependencies]
pretty_assertions = "1.4"

[package]
name = "biois"
version = "0.2.0"
publish = false
authors = [
    "Christian Beilschmidt <christian.beilschmidt@geoengine.de>",
    "Johannes Drönner <johannes.droenner@geoengine.de>",
    "Michael Mattig <michael.mattig@geoengine.de>",
]
license-file = "LICENSE"
repository = "https://github.com/geo-engine/BioIS"
edition = "2024"
default-run = "biois-server"

[workspace.lints.clippy]
# Set group priorities to -1 so individual lints (default priority 0) override them cleanly
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# disable some pedantic lints
default_trait_access = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
non_ascii_literal = "allow"
option_if_let_else = "allow"
similar_names = "allow"
wildcard_imports = "allow"

# enable some restriction lints
dbg_macro = "warn"
exit = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

# disable some cargo lints
multiple_crate_versions = "allow"

[[bin]]
name = "biois-server"
path = "src/bin/server.rs"
bench = false

[[bin]]
name = "biois-cli"
path = "src/bin/cli.rs"
bench = false

[dependencies]
anyhow = "1.0"
approx = { version = "0.6.0-rc2", features = ["derive", "vec_impl"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
biois-macros = { path = "macros" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
futures = "0.3"
geo-types = "0.7"
geoengine-api-client = { git = "https://github.com/geo-engine/geoengine", branch = "feature/md-gdal-source" }
geojson = "1.0"
indoc = "2.0"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
nom = "8.0"
ogcapi = { git = "https://github.com/georust/ogcapi", branch = "fix/missing-sync-job-in-builder", default-features = false, features = [
    "common",
    "drivers",
    "processes",
    "services",
    "types",
] }
o2o = "0.5"
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.27"
toml = "0.8"
# toasty = { version = "0.10", features = ["postgresql", "serde"] }
toasty = { git = "https://github.com/tokio-rs/toasty", branch = "main", features = [
    "migration",
    "postgresql",
    "serde",
] }
# toasty-cli = "0.11"
toasty-cli = { git = "https://github.com/tokio-rs/toasty", branch = "main" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["buffer", "limit", "load-shed", "util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5"
utoipa = { version = "5.5", features = ["uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1.26", features = ["v7"] }
wkt = "0.14"

[dev-dependencies]
httptest = "0.16"
pretty_assertions = { workspace = true }

[lints]
workspace = true
