
[server]
host = "0.0.0.0"
port = 4040

[database]
host = "localhost"
port = 5432
database = "biois"
schema = "biois"
user = "geoengine"
password = "geoengine"
# Set to `true` to start with a fresh database each time.
# If this parameter is set to `false` at the first start, subsequent changes to `true` will result in an error.
# This helps to protect production environments from unwanted data loss.
clear_database_on_start = false

[geoengine]
base_url = "http://localhost:3030/api"

[logging]
# Possible values: "off", "error", "warn", "info", "debug",
level = "info"

[data_ids]
land_use_imperviousness_builtup = "land_use_impervious_built_up"

[contact]
from = "BioIS <noreply@geoengine.de>"
to = "info@geoengine.de"

[contact.smtp]
host = "smtp-relay.gmail.com"
port = 587
# Possible values: "starttls", "tls", "none" (unencrypted, only for local testing)
tls = "starttls"
# Name used in the SMTP `EHLO` command. Defaults to the machine's hostname.
# helo_name = "biois.app.geoengine.io"
# Optional SMTP authentication. The Gmail SMTP relay also supports IP-based authentication.
# username = ""
# password = ""

# Global limit for all clients: at most `max_requests` per window
[contact.rate_limit]
max_requests = 10
window_seconds = 3600

[credits]
credits_lookup_interval_seconds = 60

[credits.biodiversity_sensitive_areas]
credits_per_site = 10

[credits.habitat_distance]
credits_per_coordinate = 5
